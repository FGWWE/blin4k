<style>
:root{--p:#ff7eb6;--hot:#ff4f9a;--lt:#ffc2dd;--bg:#07040a;--panel:#180c16;--line:rgba(255,126,182,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#f3dbe8;overflow:hidden;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5vh 1rem 7vh;transition:opacity .3s}
body.dim main{opacity:.12}
h1{margin:0;text-align:center;font-family:"Press Start 2P",monospace;font-weight:400;font-size:clamp(.9rem,3.5vw,3rem);line-height:1.5;color:#ff8fc4;text-shadow:0 0 6px #ff4f9a,0 0 22px rgba(255,79,154,.8),0 0 46px rgba(255,79,154,.5)}
.btn{font-family:"Press Start 2P",monospace;font-size:clamp(.6rem,1.2vw,.85rem);color:#ffc2dd;background:rgba(40,12,32,.75);border:2px solid var(--p);border-radius:10px;padding:1.1rem 2.1rem;cursor:pointer;box-shadow:0 0 18px rgba(255,126,182,.45),inset 0 0 12px rgba(255,126,182,.15);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(255,126,182,.7),inset 0 0 14px rgba(255,126,182,.25)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
dialog{width:min(1075px,92vw);max-height:80vh;margin:10vh auto 0;padding:0;overflow:auto;color:#f3dbe8;background:rgba(24,12,22,.96);border:2px solid var(--p);border-radius:18px;box-shadow:0 0 50px rgba(255,79,154,.4),inset 0 0 30px rgba(255,126,182,.06)}
dialog::backdrop{background:rgba(5,2,6,.5)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.4rem;border-bottom:1px solid var(--line);background:rgba(255,126,182,.07);font-family:"Pixelify Sans","Press Start 2P",monospace;font-weight:700;font-size:1.35rem;color:var(--lt);text-shadow:0 0 10px rgba(255,79,154,.7)}
.bar b{color:var(--p);margin-right:.7rem}
.x{font:700 .9rem "Pixelify Sans",monospace;color:var(--lt);background:none;border:1px solid var(--p);border-radius:8px;padding:.45rem .8rem;cursor:pointer}
.x:hover{background:rgba(255,126,182,.2)}
.body{padding:.6rem 1.4rem 1.6rem;line-height:1.75;font-size:.98rem}
h2{display:flex;align-items:center;gap:.6rem;margin:1.5rem 0 .7rem;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.4rem;color:var(--lt)}
h2::before{content:"";width:3px;height:1.2em;background:var(--p);box-shadow:0 0 8px var(--hot)}
p{margin:0}
strong{color:#ffb0d4}
.chips{display:flex;flex-wrap:wrap;gap:.8rem;padding:0;margin:0;list-style:none}
.chips li,.chips a{font-size:.9rem;color:#f3dbe8;background:rgba(255,126,182,.1);border:1px solid var(--line);border-radius:8px;padding:.5rem 1.1rem;text-decoration:none}
.chips a{font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.05rem;border-width:2px;border-color:var(--p)}
.chips li,.chips a{transition:transform .15s,box-shadow .15s,border-color .15s,background .15s}
.chips li:hover,.chips a:hover,.chips a:focus-visible{transform:scale(1.06);border-color:var(--p);background:rgba(255,126,182,.22);box-shadow:0 0 12px rgba(255,126,182,.7)}
.card{border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.4rem;background:rgba(255,126,182,.05)}
.card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:1.25rem;color:#ffb0d4}
.tag{font:500 .72rem "JetBrains Mono",monospace;color:var(--lt);border:1px solid var(--p);border-radius:6px;padding:.15rem .55rem;background:rgba(255,126,182,.12)}
.pix{display:block;width:min(300px,100%);height:auto;margin-top:1rem;border:2px solid var(--line);border-radius:10px}
@media (max-width:600px){.bar{font-size:.95rem}.card header{flex-direction:column;align-items:flex-start;gap:.4rem}}
</style>

    <h2># Связь</h2>
    <div class="chips"><a href="https://github.com/FGWWE" target="_blank" rel="noopener">GitHub</a><a href="https://t.me/BliN4ks" target="_blank" rel="noopener">Telegram</a></div>
  </div>
</dialog>

<script>
const d=document.getElementById('info');
document.getElementById('open').onclick=()=>{d.showModal();document.body.classList.add('dim')};
document.getElementById('close').onclick=()=>d.close();
d.addEventListener('close',()=>document.body.classList.remove('dim'));
d.addEventListener('click',e=>{if(e.target===d)d.close()});

// black hole + stars
const bgc=document.getElementById('bg'),sky=document.getElementById('sky');
const b=bgc.getContext('2d'),x=sky.getContext('2d');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=Math.random,TILT=-.2,CT=Math.cos(TILT),ST=Math.sin(TILT);
const pal=['#fff1f7','#ffd1e6','#ffb0d4','#ff8fc4','#ff5fa8','#e0407f','#b02a66'];
let W,H,cs,R,cx,cy,disk=[],ring=[],tick=0;

function setup(){
  W=bgc.width=sky.width=innerWidth;H=bgc.height=sky.height=innerHeight;
  cs=Math.max(3,Math.round(W/320));R=Math.min(W*.07,H*.145);cx=W/2;cy=H*.495;
  b.fillStyle='#07040a';b.fillRect(0,0,W,H);
  let g=b.createRadialGradient(cx,cy,R*.8,cx,cy,R*6.5);
  g.addColorStop(0,'rgba(255,79,154,.30)');g.addColorStop(.5,'rgba(150,30,90,.12)');g.addColorStop(1,'rgba(0,0,0,0)');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  g=b.createRadialGradient(cx,cy,R*.95,cx,cy,R*1.35);
  g.addColorStop(0,'rgba(255,126,182,.55)');g.addColorStop(1,'rgba(255,126,182,0)');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  for(let i=0,n=W*H/8000;i<n;i++){
    b.globalAlpha=.25+rnd()*.7;b.fillStyle=rnd()<.8?'#9a8495':'#d9c3d2';
    const s=rnd()<.12?cs:Math.max(2,cs/2);
    b.fillRect(Math.round(rnd()*W/cs)*cs,Math.round(rnd()*H/cs)*cs,s,s);
  }
  b.globalAlpha=1;
  disk=[];ring=[];
  for(let i=0;i<1200;i++){
    const rr=1.12+Math.pow(rnd(),1.5)*2.4;
    const c=rr<1.4?(rnd()*2|0):rr<1.9?2+(rnd()*2|0):rr<2.7?3+(rnd()*2|0):5+(rnd()*2|0);
    disk.push({rr,a:rnd()*6.283,w:.012/Math.pow(rr,1.5),j:(rnd()-.5)*R*.16*rr,c:pal[c],k:rnd()*6.283});
  }
  for(let i=0;i<280;i++)ring.push({rr:1.02+rnd()*.1,a:rnd()*6.283,w:.004,c:pal[rnd()*3|0],k:rnd()*6.283});
}
const snap=v=>Math.round(v/cs)*cs;
function dot(px,py,col,k){
  x.globalAlpha=.65+.35*Math.sin(tick*.05+k);x.fillStyle=col;x.fillRect(snap(px),snap(py),cs,cs);
}
function drawDisk(p,front){
  if((Math.sin(p.a)>0)!==front)return;
  const dx=Math.cos(p.a)*p.rr*R,dy=Math.sin(p.a)*p.rr*R*.28+p.j;
  dot(cx+dx*CT-dy*ST,cy+dx*ST+dy*CT,p.c,p.k);
}
function frame(){
  tick++;x.clearRect(0,0,W,H);
  for(const p of disk){drawDisk(p,false);p.a+=p.w}
  x.globalAlpha=1;x.fillStyle='#000';x.beginPath();x.arc(cx,cy,R*.98,0,6.283);x.fill();
  for(const p of disk)drawDisk(p,true);
  for(const p of ring){dot(cx+Math.cos(p.a)*p.rr*R,cy+Math.sin(p.a)*p.rr*R,p.c,p.k);p.a+=p.w}
  x.globalAlpha=1;
  if(!still)requestAnimationFrame(frame);
}
setup();frame();
addEventListener('resize',()=>{setup();if(still)frame()});
</script>
