<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>blin4k</title>
<meta name="description" content="blin4k">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: clamp(2.5rem, 10vw, 6rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    margin: 0;
    text-shadow: 0 0 10px rgba(255,255,255,.6), 0 0 30px rgba(255,255,255,.35), 0 0 60px rgba(150,120,255,.35);
    animation: fadein 1.6s ease-out both, glow 3.5s ease-in-out 1.6s infinite;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,.6), 0 0 30px rgba(255,255,255,.35), 0 0 60px rgba(150,120,255,.35); }
    50%      { text-shadow: 0 0 16px rgba(255,255,255,.9), 0 0 45px rgba(255,255,255,.55), 0 0 90px rgba(150,120,255,.6); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
  }
</style>
</head>
<body>
  <h1>blin4k</h1>
</body>
</html>
